name: e2e-tests
on: [push, workflow_dispatch]

permissions:
  contents: write       # potrzebne do pushu na gh-pages
  pages: write

jobs:
  test:
    runs-on: arc-runner-set
    container: maven:3-eclipse-temurin-25

    steps:
      - uses: actions/checkout@v4

      - name: Install Chrome
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl gnupg ca-certificates
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
            | gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" \
            > /etc/apt/sources.list.d/google-chrome.list
          apt-get update
          apt-get install -y --no-install-recommends google-chrome-stable

      - name: Run tests
        run: >
          mvn -B clean test

      - name: Upload allure-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

  report:
    runs-on: arc-runner-set
    needs: test
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with: { name: allure-results, path: allure-results }

      - uses: actions/checkout@v4
        continue-on-error: true
        with: { ref: gh-pages, path: gh-pages }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Generate Allure report
        run: |
          [ -d "gh-pages/history" ] && cp -r gh-pages/history allure-results/
          curl -sL https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz | tar -xz
          ./allure-2.32.0/bin/allure generate allure-results --clean -o allure-report

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report